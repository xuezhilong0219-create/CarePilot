[project]
name = "carepilot"
version = "0.1.0"
description = "售后工单助手：LangGraph 工作流 + RAG + FastAPI"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite",
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "jieba>=0.42.1",
    "fastembed>=0.9.1",
    "numpy>=2.4.6",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carepilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
