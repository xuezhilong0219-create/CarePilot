name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 uv（和 pyproject 里锁的版本一致）
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          python-version: "3.12"
          enable-cache: true

      - name: 按 uv.lock 装依赖
        run: uv sync --frozen

      # 和本地完全同一条命令：ruff check . + pytest。
      # CI 不是第二套标准，它跑的就是 scripts/check.py。
      - name: 门禁
        run: uv run --no-sync python scripts/check.py
