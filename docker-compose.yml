services:
  api:
    build: .
    image: carepilot-api
    env_file:
      - .env
    environment:
      # 默认用镜像里自带的示例知识库；用真实知识库时在 .env 里设 KB_DIR=/app/data/kb_real
      KB_DIR: ${KB_DIR:-/app/data/kb}
      CHECKPOINT_DB: /app/data/checkpoints.sqlite
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
